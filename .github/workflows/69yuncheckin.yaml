name: Python CI 2

permissions:
  contents: write   # keepalive 步骤要用 GITHUB_TOKEN 提交时间戳文件

on:
  # 每天 UTC 12:31 触发（北京时间 20:31）
  schedule:
    - cron: '31 12 * * *'

  # 允许手动触发工作流
  workflow_dispatch:

  # 提交代码到指定分支时触发
  push:
    branches:
      - main  # 只在主分支提交时触发

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}        # 这里设置可以用于多个账户
      USER1: ${{ secrets.USER1 }}            # 用户1
      PASS1: ${{ secrets.PASS1 }}            # 密码1
      USER2: ${{ secrets.USER2 }}            # 用户2
      PASS2: ${{ secrets.PASS2 }}            # 密码2
      # 可以继续扩展更多用户和密码
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # 假设你的项目有 requirements.txt

      - name: Run Python script
        run: python 69yun.py  # 执行你的 Python 脚本

      # GitHub 对公开仓库的规则：连续 60 天没有「仓库活动」就会自动禁用 scheduled
      # workflow，而 workflow 自身每天定时运行并不算活动——这正是本仓库过去反复被停的原因。
      # 此步在距最近一次提交满 25 天时写一个时间戳文件并提交，把计时器归零。
      # 用 GITHUB_TOKEN 提交不会触发新的 workflow run，不存在递归；[skip ci] 是双保险。
      - name: Keepalive（防 60 天无活动被自动禁用）
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LAST=$(git log -1 --format=%ct)
          NOW=$(date -u +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "距最近一次提交：${DAYS} 天"
          if [ "$DAYS" -lt 25 ]; then
            echo "未达 25 天阈值，本次不提交。"
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "chore: keepalive 重置活动计时器 [skip ci]"
          git push
